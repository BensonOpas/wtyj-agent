# docker-compose.yml for tenant mermaid
services:
  agent:
    image: ${MERMAID_IMAGE:?MERMAID_IMAGE must pin an immutable Tracy revision}
    container_name: wtyj-mermaid
    restart: unless-stopped
    ports:
      - "127.0.0.1:8102:8001"
    env_file:
      - ./config/platform.env
    environment:
      - GOOGLE_WORKSPACE_CLI_CREDENTIALS_FILE=/app/config/calendar-key.json
      - TENANT_RUNTIME_CONTROLS_REQUIRED=true
      - TENANT_ACCOUNT_ALLOWLIST_REQUIRED=true
    volumes:
      - ./config:/app/config:rw
      - ./data:/app/data
      - ./logs:/app/logs
    networks:
      - default
      - unboks-control
networks:
  unboks-control:
    external: true

name: Verify live Despertares follow-up WhatsApp alerts

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-despertares-follow-up-alerts-live.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployed code and send labelled WhatsApp test
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            CONTAINER='wtyj-consulta-despertares'

            docker exec -i "$CONTAINER" python - <<'PY'
            import hashlib
            import inspect
            import json

            from dashboard import api
            from shared import state_registry
            from agents.social.zernio_dm_client import send_dm_reply

            source = inspect.getsource(api)
            assert "_fire_follow_up_alerts" in source
            assert "set_follow_up_alert_dispatcher" in source
            assert state_registry._follow_up_alert_dispatcher is not None

            settings = state_registry.get_alert_settings("")
            whatsapp = ((settings or {}).get("channels") or {}).get("whatsapp") or {}
            route = state_registry.get_resolved_operator_whatsapp_route()
            destination = str(whatsapp.get("destination") or "").strip()

            assert whatsapp.get("enabled") is True
            assert destination
            assert route and route.get("conversation_id") and route.get("account_id")

            message = (
                "✅ *PRUEBA TÉCNICA DE NOTIFICACIONES*\n"
                "Consulta Despertares\n\n"
                "Las alertas de WhatsApp para *Faltan datos*, "
                "*Listo para llamar*, *Necesita respuesta* y escalaciones "
                "están activas.\n\n"
                "No requiere ninguna acción."
            )

            error = None
            try:
                sent = bool(send_dm_reply(
                    route["conversation_id"],
                    route["account_id"],
                    message,
                ))
            except Exception as exc:
                sent = False
                error = f"zernio_send_dm_reply_exception: {str(exc)[:200]}"

            state_registry.record_alert_delivery(
                None,
                "whatsapp",
                destination,
                "sent" if sent else "failed",
                error if error else (
                    None if sent else "zernio_send_dm_reply_returned_false"
                ),
                alert_type="follow_up_test",
            )

            digits = "".join(character for character in destination if character.isdigit())
            print("LIVE_VERIFY=" + json.dumps({
                "deployed_code": True,
                "dispatcher_registered": True,
                "whatsapp_enabled": True,
                "zernio_resolved": True,
                "destination_last4": digits[-4:],
                "destination_sha12": hashlib.sha256(destination.encode()).hexdigest()[:12],
                "test_status": "sent" if sent else "failed",
            }))
            if not sent:
                raise SystemExit("Labelled WhatsApp test failed")
            PY

name: Deploy Unboks dashboard production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-dashboard.yml'
      - 'wtyj/scripts/ensure_dashboard_nginx.py'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: unboks-dashboard-production
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Mark production deployment pending
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=pending \
            -f context=deploy/dashboard-production \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description='Building and publishing dashboard'

      - name: Check out deployment controls
        uses: actions/checkout@v4
        with:
          path: deployment

      - name: Check out dashboard source
        uses: actions/checkout@v4
        with:
          repository: unboks-org/unboks-dashboard-api
          ref: main
          path: dashboard

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install, test, typecheck, and build
        working-directory: dashboard
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm --filter @workspace/unboks test
          pnpm --filter @workspace/unboks run typecheck
          pnpm --filter @workspace/unboks run build
          test -f artifacts/unboks/dist/public/index.html
          test -n "$(find artifacts/unboks/dist/public/assets -type f -name '*.js' -print -quit)"

      - name: Package immutable release
        id: release
        working-directory: dashboard
        run: |
          set -euo pipefail
          DASHBOARD_SHA=$(git rev-parse HEAD)
          echo "sha=$DASHBOARD_SHA" >> "$GITHUB_OUTPUT"
          tar -C artifacts/unboks/dist/public -czf "$GITHUB_WORKSPACE/unboks-dashboard-$DASHBOARD_SHA.tgz" .
          cp "$GITHUB_WORKSPACE/deployment/wtyj/scripts/ensure_dashboard_nginx.py" \
            "$GITHUB_WORKSPACE/ensure-dashboard-nginx.py"

      - name: Upload release to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: unboks-dashboard-${{ steps.release.outputs.sha }}.tgz,ensure-dashboard-nginx.py
          target: /tmp

      - name: Activate release and verify live bundle
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            DASHBOARD_SHA='${{ steps.release.outputs.sha }}'
            ARCHIVE="/tmp/unboks-dashboard-$DASHBOARD_SHA.tgz"
            RELEASE_ROOT=/var/www/unboks-dashboard/releases
            CURRENT_LINK=/var/www/unboks-dashboard/current
            RELEASE_DIR="$RELEASE_ROOT/$DASHBOARD_SHA"
            NGINX_API_SITE=/etc/nginx/sites-enabled/api-unboks
            NGINX_DASHBOARD_SITE=/etc/nginx/sites-enabled/unboks-dashboard
            NGINX_BACKUP_ROOT=/root/nginx-backups
            NGINX_STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            NGINX_RESTORE_NEEDED=0

            echo "Deploying dashboard $DASHBOARD_SHA as $(whoami)"
            ls -ld /var/www /var/www/unboks-dashboard "$RELEASE_ROOT" "$CURRENT_LINK" "$ARCHIVE" 2>&1 || true
            if [ ! -d "$RELEASE_ROOT" ]; then
              echo "Expected release root is missing. Available nginx roots:"
              grep -R -nE 'server_name[[:space:]]+dashboard\.unboks\.org|root[[:space:]]+/var/www' \
                /etc/nginx/sites-enabled /etc/nginx/conf.d 2>/dev/null || true
              exit 1
            fi
            if [ -e "$CURRENT_LINK" ] && [ ! -L "$CURRENT_LINK" ]; then
              echo "$CURRENT_LINK exists but is not a symlink; refusing unsafe replacement"
              exit 1
            fi

            NGINX_API_REAL=$(readlink -f "$NGINX_API_SITE")
            NGINX_DASHBOARD_REAL=$(readlink -f "$NGINX_DASHBOARD_SITE")
            case "$NGINX_API_REAL" in
              /etc/nginx/*) ;;
              *) echo "API config resolved outside /etc/nginx: $NGINX_API_REAL"; exit 1 ;;
            esac
            case "$NGINX_DASHBOARD_REAL" in
              /etc/nginx/*) ;;
              *) echo "Dashboard config resolved outside /etc/nginx: $NGINX_DASHBOARD_REAL"; exit 1 ;;
            esac
            test -f "$NGINX_API_REAL"
            test -f "$NGINX_DASHBOARD_REAL"
            if [ "$NGINX_API_REAL" = "$NGINX_DASHBOARD_REAL" ]; then
              echo "API and dashboard config paths resolve to the same file; refusing mutation"
              exit 1
            fi

            if ! NGINX_DUMP=$(nginx -T 2>&1); then
              printf '%s\n' "$NGINX_DUMP"
              exit 1
            fi
            if printf '%s\n' "$NGINX_DUMP" | grep -qi 'conflicting server name'; then
              echo "Nginx reports a conflicting server name; refusing mutation"
              printf '%s\n' "$NGINX_DUMP" | grep -i 'conflicting server name' >&2
              exit 1
            fi
            DASHBOARD_SERVER_COUNT=$(printf '%s\n' "$NGINX_DUMP" | awk '
              $1 == "server_name" {
                for (index = 2; index <= NF; index++) {
                  name = $index
                  sub(/;$/, "", name)
                  if (name == "dashboard.unboks.org") count++
                }
              }
              END { print count + 0 }
            ')
            ALI_LOCATION_COUNT=$(printf '%s\n' "$NGINX_DUMP" | awk '
              {
                line = $0
                sub(/#.*/, "", line)
                if (line ~ /^[[:space:]]*location[[:space:]]+(\^~[[:space:]]+)?\/api\/ali-car-rental\/[[:space:]]*\{[[:space:]]*$/) count++
              }
              END { print count + 0 }
            ')
            if [ "$DASHBOARD_SERVER_COUNT" -ne 1 ]; then
              echo "Expected exactly one dashboard.unboks.org server, found $DASHBOARD_SERVER_COUNT"
              exit 1
            fi
            if [ "$ALI_LOCATION_COUNT" -ne 1 ]; then
              echo "Expected exactly one /api/ali-car-rental/ location, found $ALI_LOCATION_COUNT"
              exit 1
            fi

            install -d -m 0700 "$NGINX_BACKUP_ROOT"
            NGINX_API_BACKUP="$NGINX_BACKUP_ROOT/api-unboks.before-dashboard-$NGINX_STAMP"
            NGINX_DASHBOARD_BACKUP="$NGINX_BACKUP_ROOT/unboks-dashboard.before-dashboard-$NGINX_STAMP"
            cp -p "$NGINX_API_REAL" "$NGINX_API_BACKUP"
            cp -p "$NGINX_DASHBOARD_REAL" "$NGINX_DASHBOARD_BACKUP"

            restore_nginx_on_exit() {
              exit_status=$?
              trap - 0
              set +e
              if [ "$exit_status" -ne 0 ] && [ "$NGINX_RESTORE_NEEDED" -eq 1 ]; then
                echo "Deployment failed after Nginx mutation began; restoring both configs"
                restore_failed=0
                NGINX_API_RESTORE="$NGINX_API_REAL.restore-$NGINX_STAMP"
                NGINX_DASHBOARD_RESTORE="$NGINX_DASHBOARD_REAL.restore-$NGINX_STAMP"
                cp -p "$NGINX_API_BACKUP" "$NGINX_API_RESTORE" \
                  && mv -f "$NGINX_API_RESTORE" "$NGINX_API_REAL" \
                  || restore_failed=1
                cp -p "$NGINX_DASHBOARD_BACKUP" "$NGINX_DASHBOARD_RESTORE" \
                  && mv -f "$NGINX_DASHBOARD_RESTORE" "$NGINX_DASHBOARD_REAL" \
                  || restore_failed=1
                rm -f "$NGINX_API_RESTORE" "$NGINX_DASHBOARD_RESTORE"
                if [ "$restore_failed" -eq 0 ]; then
                  if nginx -t; then
                    systemctl reload nginx \
                      || echo "ERROR: restored Nginx config but reload failed" >&2
                  else
                    echo "ERROR: restored Nginx config does not validate" >&2
                  fi
                else
                  echo "ERROR: Nginx config rollback was incomplete" >&2
                fi
              fi
              rm -f /tmp/ensure-dashboard-nginx.py
              exit "$exit_status"
            }
            trap restore_nginx_on_exit 0

            NGINX_RESTORE_NEEDED=1
            python3 /tmp/ensure-dashboard-nginx.py \
              --api-config "$NGINX_API_SITE" \
              --dashboard-config "$NGINX_DASHBOARD_SITE"
            nginx -t
            systemctl reload nginx
            NGINX_RESTORE_NEEDED=0
            rm -f /tmp/ensure-dashboard-nginx.py

            mkdir -p "$RELEASE_DIR"
            tar -xzf "$ARCHIVE" -C "$RELEASE_DIR"
            test -f "$RELEASE_DIR/index.html"
            test -n "$(find "$RELEASE_DIR/assets" -type f -name '*.js' -print -quit)"

            ln -sfn "$RELEASE_DIR" "$CURRENT_LINK.next"
            mv -Tf "$CURRENT_LINK.next" "$CURRENT_LINK"
            rm -f "$ARCHIVE"

            LIVE_INDEX=$(curl -fsS --retry 5 --retry-delay 2 "https://dashboard.unboks.org/?release=$DASHBOARD_SHA")
            MAIN_ASSET=$(grep -oE '/assets/index-[^" ]+\.js' "$RELEASE_DIR/index.html" | head -1)
            test -n "$MAIN_ASSET"
            printf '%s' "$LIVE_INDEX" | grep -q "$MAIN_ASSET"

            FOLLOW_UP_FILE=$(grep -l 'Copiado' "$RELEASE_DIR"/assets/FollowUps-*.js | head -1)
            test -n "$FOLLOW_UP_FILE"
            FOLLOW_UP_ASSET="/assets/$(basename "$FOLLOW_UP_FILE")"
            LIVE_FOLLOW_UPS=$(curl -fsS --retry 5 --retry-delay 2 "https://dashboard.unboks.org$FOLLOW_UP_ASSET?release=$DASHBOARD_SHA")
            printf '%s' "$LIVE_FOLLOW_UPS" | grep -q 'Copiado'
            printf '%s' "$LIVE_FOLLOW_UPS" | grep -q 'Abrir conversación'
            printf '%s' "$LIVE_FOLLOW_UPS" | grep -q 'phone_normalized'
            printf '%s' "$LIVE_FOLLOW_UPS" | grep -q 'refetchOnMount'
            printf '%s' "$LIVE_FOLLOW_UPS" | grep -q 'refetchOnWindowFocus'
            printf '%s' "$LIVE_FOLLOW_UPS" | grep -q 'Post-quote reservation'

            POST_QUOTE_API_FILE=$(grep -l '/ali-reservations/' "$RELEASE_DIR"/assets/*.js | head -1)
            test -n "$POST_QUOTE_API_FILE"
            POST_QUOTE_API_ASSET="/assets/$(basename "$POST_QUOTE_API_FILE")"
            LIVE_POST_QUOTE_API=$(curl -fsS --retry 5 --retry-delay 2 "https://dashboard.unboks.org$POST_QUOTE_API_ASSET?release=$DASHBOARD_SHA")
            printf '%s' "$LIVE_POST_QUOTE_API" | grep -q '/ali-reservations/'

            # Vite may split the WhatsApp reply composer out of Inbox into a
            # shared lazy chunk. Locate the capability by its stable copy,
            # then verify that exact built asset over the public CDN.
            REPLY_UI_FILE=$(grep -l 'Mensaje entregado a WhatsApp' "$RELEASE_DIR"/assets/*.js | head -1)
            test -n "$REPLY_UI_FILE"
            REPLY_UI_ASSET="/assets/$(basename "$REPLY_UI_FILE")"
            LIVE_REPLY_UI=$(curl -fsS --retry 5 --retry-delay 2 "https://dashboard.unboks.org$REPLY_UI_ASSET?release=$DASHBOARD_SHA")
            printf '%s' "$LIVE_REPLY_UI" | grep -q 'Mensaje entregado a WhatsApp'
            printf '%s' "$LIVE_REPLY_UI" | grep -q 'Escribe un mensaje'
            printf '%s' "$LIVE_REPLY_UI" | grep -q 'Responder por WhatsApp'
            printf '%s' "$LIVE_REPLY_UI" | grep -q 'Plantilla de seguimiento enviada'

            REPLY_API_FILE=$(grep -l '/whatsapp/reply' "$RELEASE_DIR"/assets/*.js | head -1)
            test -n "$REPLY_API_FILE"
            REPLY_API_ASSET="/assets/$(basename "$REPLY_API_FILE")"
            LIVE_REPLY_API=$(curl -fsS --retry 5 --retry-delay 2 "https://dashboard.unboks.org$REPLY_API_ASSET?release=$DASHBOARD_SHA")
            printf '%s' "$LIVE_REPLY_API" | grep -q '/messages/whatsapp/reply'

            curl -fsSI "https://dashboard.unboks.org/rental?release=$DASHBOARD_SHA" \
              | tr -d '\r' \
              | grep -qi '^Cache-Control:.*no-store'

            docker exec -i wtyj-ali-car-rental python3 - <<'PY'
            import json
            import os
            import urllib.request

            base = "https://api.unboks.org/api/ali-car-rental/dashboard/api"
            origin = "https://dashboard.unboks.org"
            login = urllib.request.Request(
                base + "/login",
                data=json.dumps({"password": os.environ["DASHBOARD_PASSWORD"]}).encode(),
                headers={"Content-Type": "application/json", "Origin": origin},
                method="POST",
            )
            with urllib.request.urlopen(login, timeout=15) as response:
                token = json.load(response)["token"]
            request = urllib.request.Request(
                base + "/rental-catalog/capability",
                headers={
                    "Authorization": "Bearer " + token,
                    "Accept": "application/json",
                    "Origin": origin,
                },
            )
            with urllib.request.urlopen(request, timeout=15) as response:
                tenant_headers = response.headers.get_all("X-Unboks-Tenant") or []
                body = json.load(response)
            assert tenant_headers == ["ali-car-rental"], tenant_headers
            assert body == {"tenantSlug": "ali-car-rental", "enabled": True}, body
            print("Ali rental capability header and payload verified")
            PY

            readlink -f "$CURRENT_LINK" | grep -q "$DASHBOARD_SHA"
            echo "Dashboard release $DASHBOARD_SHA is live and verified"

            find "$RELEASE_ROOT" -mindepth 1 -maxdepth 1 -type d -printf '%T@ %p\n' \
              | sort -nr | tail -n +8 | cut -d' ' -f2- | xargs -r rm -rf

      - name: Mark production deployment successful
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=success \
            -f context=deploy/dashboard-production \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description='Dashboard live bundle verified'

      - name: Mark production deployment failed
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state=failure \
            -f context=deploy/dashboard-production \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description='Dashboard production deployment failed'

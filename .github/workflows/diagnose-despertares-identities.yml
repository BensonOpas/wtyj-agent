name: Diagnose Despertares prospect identities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-despertares-identities.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Compare internal and public follow-up responses
        id: probe
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            docker exec -i wtyj-consulta-despertares python3 - <<'PY'
            import json
            import time
            import urllib.error
            import urllib.request

            with open('/app/data/session_token', 'r', encoding='utf-8') as handle:
                token = handle.read().strip()

            urls = {
                'internal': 'http://127.0.0.1:8001/dashboard/api/follow-ups',
                'public': (
                    'https://api.unboks.org/api/consulta-despertares/'
                    f'dashboard/api/follow-ups?_refresh={int(time.time() * 1000)}'
                ),
            }
            for label, url in urls.items():
                req = urllib.request.Request(
                    url,
                    headers={
                        'Authorization': f'Bearer {token}',
                        'Cache-Control': 'no-cache',
                        'Pragma': 'no-cache',
                    },
                )
                try:
                    with urllib.request.urlopen(req, timeout=20) as response:
                        payload = json.loads(response.read().decode('utf-8'))
                        items = payload.get('items', [])
                        missing_phone = [
                            item['id'] for item in items
                            if not (str(item.get('phone_raw') or '').strip()
                                    or str(item.get('phone_normalized') or '').strip())
                        ]
                        missing_name = [
                            item['id'] for item in items
                            if not (str(item.get('first_name') or '').strip()
                                    or str(item.get('surnames') or '').strip())
                        ]
                        print(
                            f'RESPONSE source={label} http={response.status} '
                            f'total={len(items)} no_phone={len(missing_phone)} '
                            f'no_name={len(missing_name)} '
                            f'missing_phone_ids={",".join(map(str, missing_phone)) or "none"} '
                            f'missing_name_ids={",".join(map(str, missing_name)) or "none"}'
                        )
                except urllib.error.HTTPError as exc:
                    print(f'RESPONSE source={label} http={exc.code}')
                    raise
            PY

      - name: Publish diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.probe.outcome }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION='Internal and public identities compared'
          else
            STATE=failure
            DESCRIPTION='Public identity comparison failed'
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f context=diagnose/despertares-public-identities \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="$DESCRIPTION"

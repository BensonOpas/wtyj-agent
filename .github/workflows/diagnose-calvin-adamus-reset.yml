name: Reset Calvin Adamus tenant records

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-calvin-adamus-reset.yml'

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Back up, delete exact tenant records, and verify zero remain
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            cd /root/clients/consulta-despertares
            CONTAINER_ID=$(docker compose ps -q | head -1)
            test -n "$CONTAINER_ID"
            docker exec -i "$CONTAINER_ID" python - <<'PY'
            import datetime
            import hashlib
            import json
            import os
            import sqlite3
            import unicodedata

            from shared import state_registry

            TARGET = "calvin adamus"

            def norm(value):
                text = unicodedata.normalize("NFKD", str(value or ""))
                text = "".join(ch for ch in text if not unicodedata.combining(ch))
                return " ".join(text.casefold().split())

            def fingerprint(value):
                return hashlib.sha256(str(value).encode("utf-8")).hexdigest()[:12]

            db_path = state_registry.DB_PATH
            backup_dir = os.path.join(os.path.dirname(db_path), "reset_backups")
            os.makedirs(backup_dir, exist_ok=True)
            stamp = datetime.datetime.now(datetime.timezone.utc).strftime("%Y%m%dT%H%M%SZ")
            backup_path = os.path.join(
                backup_dir, f"calvin-adamus-reset-{stamp}.db"
            )
            source = sqlite3.connect(db_path)
            backup = sqlite3.connect(backup_path)
            source.backup(backup)
            backup.close()
            source.close()
            os.chmod(backup_path, 0o600)

            conn = state_registry._get_conn()
            conn.row_factory = None
            tables = {
                row[0] for row in conn.execute(
                    "SELECT name FROM sqlite_master WHERE type='table'"
                ).fetchall()
            }
            convs = set()
            phones = set()
            emails = set()
            customer_ids = set()
            follow_up_ids = set()
            source_message_ids = set()
            pending_ids = set()
            appointment_ids = set()
            ignored_ids = set()
            booking_ids = {"bookings": set(), "service_bookings": set()}

            if "follow_up_requests" in tables:
                for row in conn.execute(
                    "SELECT id, conversation_id, first_name, surnames, phone_raw, "
                    "phone_normalized, source_message_id FROM follow_up_requests"
                ).fetchall():
                    if norm(f"{row[2]} {row[3]}") == TARGET:
                        follow_up_ids.add(row[0])
                        convs.add(row[1])
                        phones.update(v for v in (row[4], row[5]) if v)
                        if row[6]:
                            source_message_ids.add(row[6])

            if "customers" in tables:
                for row in conn.execute(
                    "SELECT id, display_name FROM customers"
                ).fetchall():
                    if norm(row[1]) == TARGET:
                        customer_ids.add(row[0])

            if "whatsapp_threads" in tables:
                for row in conn.execute(
                    "SELECT DISTINCT phone, sender_name FROM whatsapp_threads"
                ).fetchall():
                    if norm(row[1]) == TARGET:
                        convs.add(row[0])

            if "whatsapp_booking_state" in tables:
                for row in conn.execute(
                    "SELECT phone, fields_json FROM whatsapp_booking_state"
                ).fetchall():
                    try:
                        fields = json.loads(row[1] or "{}")
                    except Exception:
                        fields = {}
                    names = [
                        fields.get("customer_name"),
                        fields.get("name"),
                        f"{fields.get('first_name', '')} {fields.get('surnames', '')}",
                        f"{fields.get('first_name', '')} {fields.get('last_name', '')}",
                    ]
                    if any(norm(value) == TARGET for value in names):
                        convs.add(row[0])

            if "pending_notifications" in tables:
                for row in conn.execute(
                    "SELECT id, customer_id, customer_name FROM pending_notifications"
                ).fetchall():
                    if norm(row[2]) == TARGET:
                        pending_ids.add(row[0])
                        convs.add(row[1])

            if "appointments" in tables:
                for row in conn.execute(
                    "SELECT id, conversation_id, customer_name FROM appointments"
                ).fetchall():
                    if norm(row[2]) == TARGET:
                        appointment_ids.add(row[0])
                        convs.add(row[1])

            if "ignored_contacts" in tables:
                for row in conn.execute(
                    "SELECT id, name, phone_original, phone_normalized, "
                    "email_original, email_normalized, external_sender_id "
                    "FROM ignored_contacts"
                ).fetchall():
                    if norm(row[1]) == TARGET:
                        ignored_ids.add(row[0])
                        phones.update(v for v in (row[2], row[3]) if v)
                        emails.update(v for v in (row[4], row[5]) if v)
                        convs.update(v for v in (row[6],) if v)

            for table in ("bookings", "service_bookings"):
                if table not in tables:
                    continue
                columns = {
                    row[1] for row in conn.execute(
                        f"PRAGMA table_info({table})"
                    ).fetchall()
                }
                selected = ["id"]
                for col in (
                    "customer_name", "customer_phone", "customer_email", "customer_id"
                ):
                    if col in columns:
                        selected.append(col)
                for row in conn.execute(
                    f"SELECT {', '.join(selected)} FROM {table}"
                ).fetchall():
                    values = dict(zip(selected, row))
                    if norm(values.get("customer_name")) == TARGET:
                        booking_ids[table].add(values["id"])
                        if values.get("customer_phone"):
                            phones.add(values["customer_phone"])
                        if values.get("customer_email"):
                            emails.add(values["customer_email"])
                        if isinstance(values.get("customer_id"), int):
                            customer_ids.add(values["customer_id"])

            if customer_ids and "customer_identifiers" in tables:
                marks = ",".join("?" for _ in customer_ids)
                for _customer_id, kind, value in conn.execute(
                    f"SELECT customer_id, type, value FROM customer_identifiers "
                    f"WHERE customer_id IN ({marks})",
                    list(customer_ids),
                ).fetchall():
                    if kind in ("phone", "wa_conversation_id", "conversation_id"):
                        convs.add(value)
                        phones.add(value)
                    elif kind == "email":
                        emails.add(value)

            candidate_values = {v for v in convs | phones | emails if v}
            if candidate_values and "customer_identifiers" in tables:
                marks = ",".join("?" for _ in candidate_values)
                linked = conn.execute(
                    f"SELECT DISTINCT customer_id FROM customer_identifiers "
                    f"WHERE value IN ({marks})",
                    list(candidate_values),
                ).fetchall()
                customer_ids.update(row[0] for row in linked)

            if len(customer_ids) != 1 or not (1 <= len(convs) <= 3):
                raise SystemExit(
                    "Safety check refused reset: expected one customer and 1-3 conversations"
                )

            candidate_values = {v for v in convs | phones | emails if v}
            if "pending_notifications" in tables and candidate_values:
                marks = ",".join("?" for _ in candidate_values)
                for row in conn.execute(
                    f"SELECT id FROM pending_notifications "
                    f"WHERE customer_id IN ({marks})",
                    list(candidate_values),
                ).fetchall():
                    pending_ids.add(row[0])
            if "appointments" in tables and candidate_values:
                marks = ",".join("?" for _ in candidate_values)
                for row in conn.execute(
                    f"SELECT id FROM appointments "
                    f"WHERE conversation_id IN ({marks})",
                    list(candidate_values),
                ).fetchall():
                    appointment_ids.add(row[0])
            if "follow_up_requests" in tables and candidate_values:
                marks = ",".join("?" for _ in candidate_values)
                for row in conn.execute(
                    f"SELECT id, source_message_id FROM follow_up_requests "
                    f"WHERE conversation_id IN ({marks})",
                    list(candidate_values),
                ).fetchall():
                    follow_up_ids.add(row[0])
                    if row[1]:
                        source_message_ids.add(row[1])
            if "inbound_processing_events" in tables and candidate_values:
                marks = ",".join("?" for _ in candidate_values)
                for row in conn.execute(
                    f"SELECT message_id FROM inbound_processing_events "
                    f"WHERE conversation_id IN ({marks})",
                    list(candidate_values),
                ).fetchall():
                    if row[0]:
                        source_message_ids.add(row[0])

            deleted = {}

            def record(table, amount):
                if amount:
                    deleted[table] = deleted.get(table, 0) + amount

            def delete_ids(table, column, values):
                if table not in tables or not values:
                    return
                marks = ",".join("?" for _ in values)
                cur = conn.execute(
                    f"DELETE FROM {table} WHERE {column} IN ({marks})",
                    list(values),
                )
                record(table, cur.rowcount)

            conn.execute("BEGIN IMMEDIATE")

            if "alert_deliveries" in tables:
                if pending_ids:
                    marks = ",".join("?" for _ in pending_ids)
                    cur = conn.execute(
                        f"DELETE FROM alert_deliveries "
                        f"WHERE escalation_id IN ({marks})",
                        list(pending_ids),
                    )
                    record("alert_deliveries", cur.rowcount)
                if appointment_ids:
                    marks = ",".join("?" for _ in appointment_ids)
                    cur = conn.execute(
                        f"DELETE FROM alert_deliveries "
                        f"WHERE appointment_id IN ({marks})",
                        list(appointment_ids),
                    )
                    record("alert_deliveries", cur.rowcount)

            if "ignored_contact_events" in tables:
                conditions = []
                params = []
                if ignored_ids:
                    marks = ",".join("?" for _ in ignored_ids)
                    conditions.append(f"ignored_contact_id IN ({marks})")
                    params.extend(ignored_ids)
                if candidate_values:
                    marks = ",".join("?" for _ in candidate_values)
                    conditions.append(f"sender_identifier IN ({marks})")
                    params.extend(candidate_values)
                if conditions:
                    cur = conn.execute(
                        "DELETE FROM ignored_contact_events WHERE " + " OR ".join(conditions),
                        params,
                    )
                    record("ignored_contact_events", cur.rowcount)

            delete_ids("whatsapp_processed", "message_id", source_message_ids)
            delete_ids(
                "inbound_processing_events", "conversation_id", candidate_values
            )
            delete_ids("follow_up_requests", "id", follow_up_ids)
            delete_ids("pending_notifications", "id", pending_ids)
            delete_ids("appointments", "id", appointment_ids)
            delete_ids("escalation_learnings", "conversation_id", candidate_values)
            delete_ids("conversation_status", "conversation_id", candidate_values)
            delete_ids("whatsapp_booking_state", "phone", candidate_values)
            delete_ids("whatsapp_threads", "phone", candidate_values)
            delete_ids("ignored_contacts", "id", ignored_ids)

            for table in ("bookings", "service_bookings"):
                delete_ids(table, "id", booking_ids[table])

            if "data_retention_audit_log" in tables and candidate_values:
                marks = ",".join("?" for _ in candidate_values)
                cur = conn.execute(
                    f"DELETE FROM data_retention_audit_log "
                    f"WHERE identifier_value IN ({marks})",
                    list(candidate_values),
                )
                record("data_retention_audit_log", cur.rowcount)

            delete_ids("customer_interactions", "customer_id", customer_ids)
            if "customer_merges" in tables and customer_ids:
                marks = ",".join("?" for _ in customer_ids)
                values = list(customer_ids)
                cur = conn.execute(
                    f"DELETE FROM customer_merges "
                    f"WHERE surviving_id IN ({marks}) OR absorbed_id IN ({marks})",
                    values + values,
                )
                record("customer_merges", cur.rowcount)
            delete_ids("customer_identifiers", "customer_id", customer_ids)
            delete_ids("customers", "id", customer_ids)

            conn.commit()
            conn.execute("PRAGMA wal_checkpoint(TRUNCATE)")
            conn.execute("VACUUM")

            def count_where(table, column, values):
                if table not in tables or not values:
                    return 0
                marks = ",".join("?" for _ in values)
                return conn.execute(
                    f"SELECT COUNT(*) FROM {table} WHERE {column} IN ({marks})",
                    list(values),
                ).fetchone()[0]

            remaining = {
                "customers": count_where("customers", "id", customer_ids),
                "customer_identifiers": count_where(
                    "customer_identifiers", "customer_id", customer_ids
                ),
                "customer_interactions": count_where(
                    "customer_interactions", "customer_id", customer_ids
                ),
                "whatsapp_threads": count_where(
                    "whatsapp_threads", "phone", candidate_values
                ),
                "whatsapp_booking_state": count_where(
                    "whatsapp_booking_state", "phone", candidate_values
                ),
                "follow_up_requests": count_where(
                    "follow_up_requests", "conversation_id", candidate_values
                ),
                "conversation_status": count_where(
                    "conversation_status", "conversation_id", candidate_values
                ),
                "inbound_processing_events": count_where(
                    "inbound_processing_events", "conversation_id", candidate_values
                ),
                "pending_notifications": count_where(
                    "pending_notifications", "customer_id", candidate_values
                ),
                "appointments": count_where(
                    "appointments", "conversation_id", candidate_values
                ),
                "escalation_learnings": count_where(
                    "escalation_learnings", "conversation_id", candidate_values
                ),
            }
            remaining_total = sum(remaining.values())
            if remaining_total:
                raise SystemExit(
                    f"Reset verification failed: {remaining_total} records remain"
                )

            print(json.dumps({
                "target": "Calvin Adamus",
                "backupCreated": True,
                "candidateFingerprints": sorted(
                    fingerprint(value) for value in candidate_values
                ),
                "deletedCounts": deleted,
                "remainingCounts": remaining,
                "verifiedZero": True,
            }, sort_keys=True))
            conn.close()
            PY

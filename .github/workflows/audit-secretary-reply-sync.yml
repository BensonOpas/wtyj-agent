name: Audit secretary reply sync

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-secretary-reply-sync.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check synced operator messages without exposing their content
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            docker exec -i wtyj-consulta-despertares python - <<'PY'
            import json
            import sqlite3

            db = sqlite3.connect("file:/app/data/state_registry.db?mode=ro", uri=True)
            db.row_factory = sqlite3.Row
            rows = db.execute("""
                SELECT
                  o.phone AS conversation_id,
                  COUNT(*) AS operator_message_count,
                  MIN(o.created_at) AS first_operator_message_at,
                  MAX(o.created_at) AS last_operator_message_at,
                  COALESCE((
                    SELECT t.sender_name
                    FROM whatsapp_threads t
                    WHERE t.phone = o.phone
                      AND t.sender_name IS NOT NULL
                      AND TRIM(t.sender_name) != ''
                    ORDER BY t.created_at DESC
                    LIMIT 1
                  ), 'Contacto sin identificar') AS prospect_name
                FROM whatsapp_threads o
                WHERE o.role = 'operator'
                  AND o.channel = 'whatsapp'
                GROUP BY o.phone
                ORDER BY last_operator_message_at DESC
                LIMIT 50
            """).fetchall()
            db.close()
            print("SECRETARY_SYNC_AUDIT=" + json.dumps({
              "synced_operator_conversations": [
                {
                  "prospect_name": row["prospect_name"],
                  "operator_message_count": row["operator_message_count"],
                  "first_operator_message_at": row["first_operator_message_at"],
                  "last_operator_message_at": row["last_operator_message_at"],
                }
                for row in rows
              ],
              "content_exposed": False,
            }, ensure_ascii=False))
            PY
name: Audit August model usage

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-august-model-usage.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit production model usage without customer content
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            START='2026-08-09T00:00:00+00:00'
            END='2026-08-11T00:00:00+00:00'
            containers="$(docker ps --format '{{.Names}}' | grep '^wtyj-' || true)"
            if [ -z "$containers" ]; then
              echo 'AUGUST_MODEL_USAGE_AUDIT={"error":"no_wtyj_containers_found"}'
              exit 0
            fi
            for container in $containers; do
              echo "AUGUST_MODEL_USAGE_CONTAINER=$container"
              docker exec "$container" python3 -c '
import collections
import json
import pathlib
import sys

start, end = sys.argv[1], sys.argv[2]
files = sorted(pathlib.Path("/app/logs").glob("agent.log*"))
totals = collections.defaultdict(lambda: {"calls": 0, "input_tokens": 0, "output_tokens": 0})
parsed = 0
for path in files:
    if not path.is_file() or path.suffix == ".gz":
        continue
    try:
        lines = path.read_text(errors="replace").splitlines()
    except OSError:
        continue
    for raw in lines:
        try:
            rec = json.loads(raw)
        except (TypeError, ValueError):
            continue
        parsed += 1
        timestamp = str(rec.get("ts") or "")
        if not (start <= timestamp < end) or rec.get("event") != "api_usage":
            continue
        key = "{}|{}".format(rec.get("model") or "unknown", rec.get("channel") or "unknown")
        item = totals[key]
        item["calls"] += 1
        item["input_tokens"] += int(rec.get("input_tokens") or 0)
        item["output_tokens"] += int(rec.get("output_tokens") or 0)
print("AUGUST_MODEL_USAGE=" + json.dumps({
    "period_utc": [start, end],
    "log_files_seen": [path.name for path in files],
    "records_parsed": parsed,
    "by_model_and_channel": dict(sorted(totals.items())),
}, sort_keys=True))
' "$START" "$END"
              docker exec "$container" sh -lc \
                "grep -R -h --include='*.py' -E 'model=[\"'\'' ]*claude-' /app/agents /app/dashboard 2>/dev/null | sort -u | sed 's/^/RUNTIME_MODEL_CALL=/' || true"
            done

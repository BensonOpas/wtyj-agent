name: Deploy dashboard archive action

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-dashboard-release-path.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build and atomically deploy merged dashboard release
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 15m
          script: |
            set -eu
            SOURCE_REPO=/root/unboks-dashboard-api
            DEPLOY_SHA=0e936089dc60b3562900c4bcd3f7cd1820845878
            RELEASE_ROOT=/var/www/unboks-dashboard/releases
            RELEASE_DIR="$RELEASE_ROOT/$DEPLOY_SHA"
            DEPLOY_TMP=$(mktemp -d /tmp/unboks-dashboard-deploy.XXXXXX)
            WORKTREE_ADDED=0

            cleanup() {
              if [ "$WORKTREE_ADDED" = 1 ]; then
                git -C "$SOURCE_REPO" worktree remove --force "$DEPLOY_TMP" >/dev/null 2>&1 || true
              else
                rmdir "$DEPLOY_TMP" >/dev/null 2>&1 || true
              fi
            }
            trap cleanup EXIT

            test -d "$SOURCE_REPO/.git"
            git -C "$SOURCE_REPO" fetch origin main
            git -C "$SOURCE_REPO" cat-file -e "$DEPLOY_SHA^{commit}"
            git -C "$SOURCE_REPO" worktree add --detach "$DEPLOY_TMP" "$DEPLOY_SHA"
            WORKTREE_ADDED=1

            cd "$DEPLOY_TMP"
            pnpm install --frozen-lockfile
            pnpm --filter @workspace/unboks run typecheck
            PORT=25767 BASE_PATH=/ pnpm --filter @workspace/unboks run build

            test -f artifacts/unboks/dist/public/index.html
            grep -Rqs "Prospecto archivado" artifacts/unboks/dist/public/assets

            install -d "$RELEASE_DIR"
            cp -a artifacts/unboks/dist/public/. "$RELEASE_DIR/"
            ln -sfn "$RELEASE_DIR" /var/www/unboks-dashboard/current.next
            mv -Tf /var/www/unboks-dashboard/current.next /var/www/unboks-dashboard/current

            nginx -t
            test "$(readlink -f /var/www/unboks-dashboard/current)" = "$RELEASE_DIR"
            curl -fsS https://dashboard.unboks.org/ >/dev/null
            echo "DEPLOYED_RELEASE=$DEPLOY_SHA"

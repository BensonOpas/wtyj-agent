name: Diagnose Despertares follow-up status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-despertares-follow-up.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Locate Consulta Despertares runtime
        id: probe
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            TARGET=$(docker ps --format '{{.Names}}' | grep -Ei 'consulta|despertares' | head -1)
            test -n "$TARGET"
            echo "Target container: $TARGET"
            docker inspect --format 'configured_image={{.Config.Image}} image_id={{.Image}} created={{.Created}}' "$TARGET"
            docker inspect --format 'compose_working_dir={{index .Config.Labels "com.docker.compose.project.working_dir"}} compose_config={{index .Config.Labels "com.docker.compose.project.config_files"}} compose_service={{index .Config.Labels "com.docker.compose.service"}}' "$TARGET"
            echo "Latest application image:"
            docker image inspect --format 'name={{index .RepoTags 0}} image_id={{.Id}} created={{.Created}}' wtyj-agent:latest
            echo "Matching client runtime directories:"
            find /root/clients -maxdepth 1 -mindepth 1 -type d -printf '%f\n' | grep -Ei 'consulta|despertares' || true
            echo "Follow-up endpoint response:"
            docker exec -i "$TARGET" python3 - <<'PY'
            import urllib.error
            import urllib.request

            with open('/app/data/session_token', 'r', encoding='utf-8') as handle:
                token = handle.read().strip()
            request = urllib.request.Request(
                'http://127.0.0.1:8001/follow-ups',
                headers={'Authorization': f'Bearer {token}'},
            )
            try:
                with urllib.request.urlopen(request, timeout=20) as response:
                    print(f'HTTP {response.status}')
            except urllib.error.HTTPError as exc:
                print(f'HTTP {exc.code}: {exc.read().decode("utf-8", errors="replace")[:300]}')
            PY

      - name: Publish diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.probe.outcome }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION='Despertares runtime located'
          else
            STATE=failure
            DESCRIPTION='Despertares runtime inspection failed'
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f context=diagnose/despertares-runtime \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="$DESCRIPTION"

name: Diagnose Despertares follow-up status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-despertares-follow-up.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose Consulta Despertares startup
        id: probe
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            TARGET=wtyj-consulta-despertares
            echo "Container state:"
            docker inspect --format 'status={{.State.Status}} running={{.State.Running}} restarting={{.State.Restarting}} exit_code={{.State.ExitCode}} error={{.State.Error}} image={{.Config.Image}} image_id={{.Image}}' "$TARGET"
            echo "Published ports:"
            docker port "$TARGET" || true
            echo "Compose status:"
            cd /root/clients/consulta-despertares
            docker compose ps
            echo "Host health response:"
            curl -sS -m 5 -o /dev/null -w 'HTTP %{http_code}\n' http://localhost:8003/health || true
            if [ "$(docker inspect --format '{{.State.Running}}' "$TARGET")" = "true" ]; then
              echo "Container-local health response:"
              docker exec "$TARGET" python3 - <<'PY'
            import urllib.error
            import urllib.request
            try:
                with urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5) as response:
                    print(f'HTTP {response.status}: {response.read().decode("utf-8", errors="replace")[:300]}')
            except Exception as exc:
                print(f'{type(exc).__name__}: {exc}')
            PY
            fi
            echo "Redacted startup errors:"
            docker logs --since 10m "$TARGET" 2>&1 |
              grep -Ei 'traceback|error|exception|failed|invalid|missing|required|refused' |
              tail -n 120 |
              sed -E 's/[0-9]{6,}/[redacted-number]/g' || true

      - name: Publish diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.probe.outcome }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION='Despertares startup inspected'
          else
            STATE=failure
            DESCRIPTION='Despertares startup inspection failed'
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f context=diagnose/despertares-startup \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="$DESCRIPTION"

name: Diagnose Despertares follow-up status

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-despertares-follow-up.yml'

permissions:
  contents: read
  statuses: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Copiado persistence in Consulta Despertares
        id: probe
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            TARGET=wtyj-consulta-despertares
            docker exec -i "$TARGET" python3 - <<'PY'
            import json
            import urllib.error
            import urllib.request

            with open('/app/data/session_token', 'r', encoding='utf-8') as handle:
                token = handle.read().strip()

            base = 'http://127.0.0.1:8001/dashboard/api'
            headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

            def request(path, method='GET', body=None):
                data = json.dumps(body).encode('utf-8') if body is not None else None
                req = urllib.request.Request(base + path, data=data, headers=headers, method=method)
                try:
                    with urllib.request.urlopen(req, timeout=20) as response:
                        payload = json.loads(response.read().decode('utf-8'))
                        return response.status, payload
                except urllib.error.HTTPError as exc:
                    raw = exc.read().decode('utf-8', errors='replace')
                    print(f'HTTP {exc.code} for {method} {path}: {raw[:300]}')
                    raise

            list_status, envelope = request('/follow-ups')
            items = envelope.get('items', [])
            candidates = [row for row in items if row.get('status') != 'copied']
            if not candidates:
                raise SystemExit('No non-copied follow-up available for reversible probe')
            item = next((row for row in candidates if row.get('status') != 'closed'), candidates[0])
            follow_up_id = int(item['id'])
            original_status = str(item.get('status') or 'collecting')
            print(f'GET list: HTTP {list_status}; probe_id={follow_up_id}; original_status={original_status}')

            changed = False
            restored_status = None
            try:
                copied_status, copied = request(
                    f'/follow-ups/{follow_up_id}/status',
                    method='POST',
                    body={'status': 'copied'},
                )
                changed = True
                print(f'POST copied: HTTP {copied_status}; status={copied.get("status")}')

                get_status, persisted = request(f'/follow-ups/{follow_up_id}')
                print(f'GET reload: HTTP {get_status}; persisted_status={persisted.get("status")}')
                if copied.get('status') != 'copied' or persisted.get('status') != 'copied':
                    raise SystemExit('Copied status did not persist after reload')
            finally:
                if changed:
                    restore_http, restored = request(
                        f'/follow-ups/{follow_up_id}/status',
                        method='POST',
                        body={'status': original_status},
                    )
                    restored_status = restored.get('status')
                    print(f'POST restore: HTTP {restore_http}; status={restored_status}')

            if restored_status != original_status:
                raise SystemExit('Original status was not restored')
            print('LIVE_COPIED_STATUS_PROBE_OK')
            PY

      - name: Publish diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.probe.outcome }}
        run: |
          if [ "$RESULT" = "success" ]; then
            STATE=success
            DESCRIPTION='Copiado persists after reload'
          else
            STATE=failure
            DESCRIPTION='Copiado production probe failed'
          fi
          gh api --method POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$STATE" \
            -f context=diagnose/despertares-copied \
            -f target_url="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            -f description="$DESCRIPTION"

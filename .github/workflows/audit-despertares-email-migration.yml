name: Migrate live Despertares account email

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-despertares-email-migration.yml'

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Update account email, alerts, and active references
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            python3 - <<'PY'
            import json
            import os
            import re
            import shutil
            import sqlite3
            from datetime import datetime, timezone
            from pathlib import Path

            old = "Rjr73@hotmail.com"
            old_lower = old.lower()
            new = "info@consultadespertares.com"

            tenant_config = Path("/root/clients/consulta-despertares/config/client.json")
            tenant_config_bak = Path("/root/clients/consulta-despertares/config/client.json.bak")
            tenant_db = Path("/root/clients/consulta-despertares/data/state_registry.db")
            unboks_db = Path("/root/clients/unboks/data/state_registry.db")
            control_root = Path("/root/unboks-internal-control-panel/data")
            control_db = control_root / "nr3.db"
            knowledge_cache = control_root / "nr2_knowledge_cache.json"

            stamp = datetime.now(timezone.utc).strftime("%Y%m%dT%H%M%SZ")
            backup_root = Path("/root/backups/despertares_email_migration") / stamp
            backup_root.mkdir(parents=True, exist_ok=False)

            def backup_file(path: Path) -> None:
                if not path.is_file():
                    return
                target = backup_root / path.as_posix().lstrip("/").replace("/", "__")
                shutil.copy2(path, target)

            def backup_sqlite(path: Path) -> None:
                if not path.is_file():
                    return
                target = backup_root / (path.as_posix().lstrip("/").replace("/", "__") + ".db")
                source = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
                destination = sqlite3.connect(target)
                source.backup(destination)
                destination.close()
                source.close()

            for path in (tenant_config, tenant_config_bak, knowledge_cache):
                backup_file(path)
            for path in (tenant_db, unboks_db, control_db):
                backup_sqlite(path)

            def replace_old(value):
                if isinstance(value, dict):
                    return {key: replace_old(child) for key, child in value.items()}
                if isinstance(value, list):
                    return [replace_old(child) for child in value]
                if isinstance(value, str):
                    return re.sub(re.escape(old), new, value, flags=re.IGNORECASE)
                return value

            def atomic_write_json(path: Path, payload) -> None:
                original = path.stat()
                temporary = path.with_name(path.name + ".email-migration-tmp")
                temporary.write_text(
                    json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
                    encoding="utf-8",
                )
                os.chmod(temporary, original.st_mode)
                os.chown(temporary, original.st_uid, original.st_gid)
                os.replace(temporary, path)

            for path in (tenant_config, tenant_config_bak):
                payload = replace_old(json.loads(path.read_text(encoding="utf-8")))
                payload["email"] = new
                business = payload.setdefault("business", {})
                business["email"] = new
                business["support_email"] = new
                atomic_write_json(path, payload)

            if knowledge_cache.is_file():
                cache_payload = replace_old(
                    json.loads(knowledge_cache.read_text(encoding="utf-8"))
                )
                atomic_write_json(knowledge_cache, cache_payload)

            tenant_conn = sqlite3.connect(tenant_db)
            try:
                has_alert_settings = tenant_conn.execute(
                    "SELECT 1 FROM sqlite_master "
                    "WHERE type='table' AND name='alert_settings'"
                ).fetchone()
                if has_alert_settings:
                    row = tenant_conn.execute(
                        "SELECT 1 FROM alert_settings WHERE id = 1"
                    ).fetchone()
                    if row:
                        tenant_conn.execute(
                            "UPDATE alert_settings SET "
                            "email_destination = ?, "
                            "email_alternative_destination = CASE "
                            "WHEN lower(coalesce(email_alternative_destination, '')) = ? "
                            "THEN ? ELSE email_alternative_destination END "
                            "WHERE id = 1",
                            (new, old_lower, new),
                        )
                tenant_conn.commit()
            finally:
                tenant_conn.close()

            unboks_conn = sqlite3.connect(unboks_db)
            try:
                unboks_conn.execute(
                    "UPDATE ignored_contacts SET "
                    "email_original = ?, email_normalized = ? "
                    "WHERE lower(coalesce(email_original, '')) = ? "
                    "OR lower(coalesce(email_normalized, '')) = ?",
                    (new, new.lower(), old_lower, old_lower),
                )
                unboks_conn.commit()
            finally:
                unboks_conn.close()

            control_conn = sqlite3.connect(control_db)
            try:
                control_conn.execute(
                    "DELETE FROM password_reset_tokens "
                    "WHERE lower(coalesce(email, '')) = ? "
                    "OR lower(coalesce(email_key, '')) = ?",
                    (old_lower, old_lower),
                )
                control_conn.commit()
            finally:
                control_conn.close()

            print("MIGRATION_BACKUP_CREATED=true")
            print("MIGRATION_BACKUP_LOCATION=" + str(backup_root))
            PY

            docker restart wtyj-consulta-despertares >/dev/null
            docker restart unboks-internal-control-panel-wtyj-admin-1 >/dev/null

            for name in wtyj-consulta-despertares unboks-internal-control-panel-wtyj-admin-1; do
              running=$(docker inspect "$name" --format '{{.State.Running}}')
              if [ "$running" != "true" ]; then
                echo "SERVICE_RUNNING=false:$name"
                exit 1
              fi
              echo "SERVICE_RUNNING=true:$name"
            done

            docker exec -i wtyj-consulta-despertares python - <<'PY'
            import json
            import sqlite3
            from pathlib import Path

            old = "rjr73@hotmail.com"
            new = "info@consultadespertares.com"
            config_path = Path("/app/config/client.json")
            backup_path = Path("/app/config/client.json.bak")
            payload = json.loads(config_path.read_text(encoding="utf-8"))
            business = payload.get("business") or {}

            db = sqlite3.connect("file:/app/data/state_registry.db?mode=ro", uri=True)
            row = db.execute(
                "SELECT email_destination, email_alternative_destination "
                "FROM alert_settings WHERE id = 1"
            ).fetchone()
            historical_old = db.execute(
                "SELECT COUNT(*) FROM alert_deliveries "
                "WHERE lower(coalesce(destination, '')) = ?",
                (old,),
            ).fetchone()[0]
            db.close()

            stored_destination = str(row[0] or "") if row else ""
            resolved_destination = stored_destination
            if not resolved_destination or resolved_destination == "default":
                resolved_destination = str(
                    business.get("support_email")
                    or business.get("email")
                    or payload.get("email")
                    or ""
                )

            print("VERIFY_ACCOUNT_EMAIL_NEW=" + str(
                str(payload.get("email") or "").lower() == new
            ).lower())
            print("VERIFY_BUSINESS_EMAIL_NEW=" + str(
                str(business.get("email") or "").lower() == new
            ).lower())
            print("VERIFY_SUPPORT_EMAIL_NEW=" + str(
                str(business.get("support_email") or "").lower() == new
            ).lower())
            print("VERIFY_ALERT_DESTINATION_NEW=" + str(
                resolved_destination.lower() == new
            ).lower())
            print("VERIFY_ACTIVE_CONFIG_OLD_COUNT=" + str(
                config_path.read_text(encoding="utf-8").lower().count(old)
                + backup_path.read_text(encoding="utf-8").lower().count(old)
            ))
            print("VERIFY_HISTORICAL_ALERT_DELIVERIES_RETAINED=" + str(
                int(historical_old)
            ))
            PY

            python3 - <<'PY'
            import sqlite3
            from pathlib import Path

            old = "rjr73@hotmail.com"
            new = "info@consultadespertares.com"

            unboks = sqlite3.connect(
                "file:/root/clients/unboks/data/state_registry.db?mode=ro",
                uri=True,
            )
            ignored_old = unboks.execute(
                "SELECT COUNT(*) FROM ignored_contacts "
                "WHERE lower(coalesce(email_original, '')) = ? "
                "OR lower(coalesce(email_normalized, '')) = ?",
                (old, old),
            ).fetchone()[0]
            ignored_new = unboks.execute(
                "SELECT COUNT(*) FROM ignored_contacts "
                "WHERE lower(coalesce(email_original, '')) = ? "
                "OR lower(coalesce(email_normalized, '')) = ?",
                (new, new),
            ).fetchone()[0]
            unboks.close()

            control = sqlite3.connect(
                "file:/root/unboks-internal-control-panel/data/nr3.db?mode=ro",
                uri=True,
            )
            old_tokens = control.execute(
                "SELECT COUNT(*) FROM password_reset_tokens "
                "WHERE lower(coalesce(email, '')) = ? "
                "OR lower(coalesce(email_key, '')) = ?",
                (old, old),
            ).fetchone()[0]
            control.close()

            cache_path = Path(
                "/root/unboks-internal-control-panel/data/nr2_knowledge_cache.json"
            )
            cache_old = (
                cache_path.read_text(encoding="utf-8").lower().count(old)
                if cache_path.is_file()
                else 0
            )

            print("VERIFY_IGNORED_CONTACT_OLD_COUNT=" + str(int(ignored_old)))
            print("VERIFY_IGNORED_CONTACT_NEW_COUNT=" + str(int(ignored_new)))
            print("VERIFY_OLD_RESET_TOKEN_COUNT=" + str(int(old_tokens)))
            print("VERIFY_ACTIVE_CACHE_OLD_COUNT=" + str(int(cache_old)))
            PY

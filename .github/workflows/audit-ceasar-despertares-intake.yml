name: Backfill Ceasar Despertares prospect card

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-ceasar-despertares-intake.yml'

permissions:
  contents: read

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Backfill only details explicitly present in the Ceasar conversation
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            cd /root/clients/consulta-despertares
            CONTAINER_ID=$(docker compose ps -q | head -1)
            test -n "$CONTAINER_ID"
            docker exec -i "$CONTAINER_ID" python - <<'PY'
            import json
            import unicodedata

            from shared import state_registry

            TARGETS = {"ceasar emperor roma", "caesar emperor roma"}
            VISIT_REASON = (
                "Comenta que, desde que ganaron el Mundial, se siente como el "
                "emperador César y quiere luchar con elefantes en el Coliseo."
            )

            def norm(value):
                text = unicodedata.normalize("NFKD", str(value or ""))
                text = "".join(ch for ch in text if not unicodedata.combining(ch))
                return " ".join(text.casefold().split())

            conn = state_registry._get_conn()
            try:
                rows = conn.execute(
                    "SELECT id, conversation_id, first_name, surnames "
                    "FROM follow_up_requests ORDER BY updated_at DESC"
                ).fetchall()
                matches = [
                    row for row in rows
                    if norm(f"{row[2]} {row[3]}") in TARGETS
                ]
                if len(matches) != 1:
                    raise SystemExit(
                        f"Expected one exact Ceasar prospect, found {len(matches)}"
                    )

                follow_up_id, conversation_id, _, _ = matches[0]
                state_row = conn.execute(
                    "SELECT fields_json FROM whatsapp_booking_state WHERE phone = ?",
                    (conversation_id,),
                ).fetchone()
                if not state_row:
                    raise SystemExit("Ceasar conversation state was not found")

                fields = json.loads(state_row[0] or "{}")
                fields["session_type"] = "Presencial"
                fields["visit_reason"] = VISIT_REASON

                conn.execute(
                    "UPDATE whatsapp_booking_state SET fields_json = ? WHERE phone = ?",
                    (json.dumps(fields, ensure_ascii=False), conversation_id),
                )
                conn.execute(
                    "UPDATE follow_up_requests SET visit_reason = ? WHERE id = ?",
                    (VISIT_REASON, follow_up_id),
                )
                conn.commit()

                saved_state = conn.execute(
                    "SELECT fields_json FROM whatsapp_booking_state WHERE phone = ?",
                    (conversation_id,),
                ).fetchone()
                saved_follow_up = conn.execute(
                    "SELECT visit_reason FROM follow_up_requests WHERE id = ?",
                    (follow_up_id,),
                ).fetchone()
                saved_fields = json.loads(saved_state[0] or "{}")
                assert saved_fields.get("session_type") == "Presencial"
                assert saved_fields.get("visit_reason") == VISIT_REASON
                assert saved_follow_up and saved_follow_up[0] == VISIT_REASON
                print(json.dumps({
                    "matched_prospect": "Ceasar Emperor Roma",
                    "session_type": saved_fields["session_type"],
                    "visit_reason_saved": True,
                    "appointment_preference_unchanged": True,
                }, ensure_ascii=False, sort_keys=True))
            finally:
                conn.close()
            PY

name: Delete Calvin Ceasar Despertares test identity

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-ceasar-despertares-intake.yml'

permissions:
  contents: read

jobs:
  delete-test-identity:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the exact linked Calvin/Ceasar test identity and verify absence
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -eu
            cd /root/clients/consulta-despertares
            CONTAINER_ID=$(docker compose ps -q | head -1)
            test -n "$CONTAINER_ID"
            docker exec -i "$CONTAINER_ID" python - <<'PY'
            import json
            import unicodedata

            from shared import state_registry

            TARGETS = {"ceasar emperor roma", "caesar emperor roma"}

            def norm(value):
                text = unicodedata.normalize("NFKD", str(value or ""))
                text = "".join(ch for ch in text if not unicodedata.combining(ch))
                return " ".join(text.casefold().split())

            def qident(value):
                return '"' + str(value).replace('"', '""') + '"'

            conn = state_registry._get_conn()
            try:
                rows = conn.execute(
                    "SELECT id, conversation_id, first_name, surnames, "
                    "source_message_id FROM follow_up_requests ORDER BY updated_at DESC"
                ).fetchall()
                matches = [
                    row for row in rows
                    if norm(f"{row[2]} {row[3]}") in TARGETS
                ]
                if len(matches) != 1:
                    raise SystemExit(
                        f"Expected one exact Ceasar prospect, found {len(matches)}"
                    )

                _, conversation_id, _, _, source_message_id = matches[0]
                customer_ids = [
                    row[0] for row in conn.execute(
                        "SELECT DISTINCT customer_id FROM customer_identifiers "
                        "WHERE value = ?",
                        (conversation_id,),
                    ).fetchall()
                ]
                message_ids = {
                    row[0] for row in conn.execute(
                        "SELECT message_id FROM inbound_processing_events "
                        "WHERE conversation_id = ?",
                        (conversation_id,),
                    ).fetchall()
                    if row[0]
                }
                if source_message_id:
                    message_ids.add(source_message_id)

                table_rows = conn.execute(
                    "SELECT name FROM sqlite_master WHERE type = 'table' "
                    "AND name NOT LIKE 'sqlite_%'"
                ).fetchall()
                table_names = [row[0] for row in table_rows]
                deleted = {}

                conn.execute("BEGIN")
                # Delete every tenant-local row whose declared relationship points
                # exactly to this conversation or its linked customer row.
                for table in table_names:
                    if table in {"customers", "customer_identifiers", "customer_merges"}:
                        continue
                    columns = {
                        row[1] for row in conn.execute(
                            f"PRAGMA table_info({qident(table)})"
                        ).fetchall()
                    }
                    conditions = []
                    params = []
                    if "conversation_id" in columns:
                        conditions.append(f"{qident('conversation_id')} = ?")
                        params.append(conversation_id)
                    if "phone" in columns:
                        conditions.append(f"{qident('phone')} = ?")
                        params.append(conversation_id)
                    if "customer_id" in columns:
                        customer_values = [conversation_id, *customer_ids]
                        placeholders = ",".join("?" for _ in customer_values)
                        conditions.append(
                            f"{qident('customer_id')} IN ({placeholders})"
                        )
                        params.extend(customer_values)
                    if not conditions:
                        continue
                    cur = conn.execute(
                        f"DELETE FROM {qident(table)} WHERE " + " OR ".join(conditions),
                        params,
                    )
                    if cur.rowcount:
                        deleted[table] = cur.rowcount

                if message_ids and "whatsapp_processed" in table_names:
                    ids = sorted(message_ids)
                    placeholders = ",".join("?" for _ in ids)
                    cur = conn.execute(
                        f"DELETE FROM whatsapp_processed WHERE message_id IN ({placeholders})",
                        ids,
                    )
                    if cur.rowcount:
                        deleted["whatsapp_processed"] = cur.rowcount

                if customer_ids:
                    placeholders = ",".join("?" for _ in customer_ids)
                    if "customer_merges" in table_names:
                        cur = conn.execute(
                            f"DELETE FROM customer_merges WHERE surviving_id IN ({placeholders}) "
                            f"OR absorbed_id IN ({placeholders})",
                            [*customer_ids, *customer_ids],
                        )
                        if cur.rowcount:
                            deleted["customer_merges"] = cur.rowcount
                    cur = conn.execute(
                        f"DELETE FROM customer_identifiers WHERE customer_id IN ({placeholders})",
                        customer_ids,
                    )
                    if cur.rowcount:
                        deleted["customer_identifiers"] = cur.rowcount
                    cur = conn.execute(
                        f"DELETE FROM customers WHERE id IN ({placeholders})",
                        customer_ids,
                    )
                    if cur.rowcount:
                        deleted["customers"] = cur.rowcount

                conn.commit()

                remaining = {
                    "follow_up_requests": conn.execute(
                        "SELECT COUNT(*) FROM follow_up_requests "
                        "WHERE conversation_id = ? OR "
                        "lower(trim(first_name || ' ' || surnames)) IN (?, ?)",
                        (conversation_id, *sorted(TARGETS)),
                    ).fetchone()[0],
                    "whatsapp_threads": conn.execute(
                        "SELECT COUNT(*) FROM whatsapp_threads WHERE phone = ?",
                        (conversation_id,),
                    ).fetchone()[0],
                    "whatsapp_booking_state": conn.execute(
                        "SELECT COUNT(*) FROM whatsapp_booking_state WHERE phone = ?",
                        (conversation_id,),
                    ).fetchone()[0],
                    "conversation_status": conn.execute(
                        "SELECT COUNT(*) FROM conversation_status WHERE conversation_id = ?",
                        (conversation_id,),
                    ).fetchone()[0],
                    "customer_identifiers": conn.execute(
                        "SELECT COUNT(*) FROM customer_identifiers WHERE value = ?",
                        (conversation_id,),
                    ).fetchone()[0],
                }
                if any(remaining.values()):
                    raise SystemExit(f"Deletion verification failed: {remaining}")

                print(json.dumps({
                    "matched_identity": "Calvin/Ceasar",
                    "deleted_rows_by_table": deleted,
                    "remaining_matches": remaining,
                    "fresh_prospect_ready": True,
                }, sort_keys=True))
            except Exception:
                conn.rollback()
                raise
            finally:
                conn.close()
            PY

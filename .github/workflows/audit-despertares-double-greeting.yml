name: Audit Despertares double greeting

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-despertares-double-greeting.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live agent code and tenant runtime
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            APP_REPO=/root/wtyj-agent-source
            test -d "$APP_REPO/.git"
            echo "HEAD=$(git -C "$APP_REPO" rev-parse HEAD)"
            echo "RELEVANT_FILES"
            git -C "$APP_REPO" ls-files | grep -Ei '(prompt|agent|tenant|message|reply|language|greeting|config)' | head -n 300 || true
            echo "GREETING_MATCHES"
            git -C "$APP_REPO" grep -n -Ei 'greet|greeting|salud|language|idioma|introduc|presenta|assistant name|agent name|Alia|Alía|reply in|respond in' -- '*.py' '*.ts' '*.tsx' '*.js' '*.json' '*.md' | head -n 700 || true
            echo "TENANT_CONTAINER_MOUNTS"
            docker inspect wtyj-consulta-despertares --format '{{range .Mounts}}{{.Type}} {{.Source}} -> {{.Destination}}{{println}}{{end}}'
            echo "TENANT_CONTAINER_FILES"
            docker exec wtyj-consulta-despertares sh -lc "pwd; find /app /data /config -maxdepth 3 -type f 2>/dev/null | grep -Ei '(prompt|tenant|config|json|yaml|sqlite|db)' | head -n 250 || true"

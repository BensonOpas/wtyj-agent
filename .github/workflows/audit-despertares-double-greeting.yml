name: Audit Despertares double greeting

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-despertares-double-greeting.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Despertares deployment layout
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            APP_REPO=/root/wtyj-agent-source
            echo "DEPLOY_FILES"
            git -C "$APP_REPO" ls-files | grep -Ei '(^|/)(dockerfile|docker-compose|compose|deploy|provision|release|rollback)' | head -n 300 || true
            echo "CONTAINER_LABELS"
            docker inspect wtyj-consulta-despertares --format '{{json .Config.Labels}}'
            echo "CONTAINER_IMAGE"
            docker inspect wtyj-consulta-despertares --format '{{.Config.Image}} {{.Image}}'
            echo "COMPOSE_FILES"
            find /root /opt /srv -maxdepth 4 -type f \( -name 'docker-compose*.yml' -o -name 'docker-compose*.yaml' -o -name 'compose*.yml' -o -name 'compose*.yaml' \) -print 2>/dev/null | head -n 100 || true

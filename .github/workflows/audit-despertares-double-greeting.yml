name: Audit Despertares double greeting

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-despertares-double-greeting.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Locate live agent code
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            echo "GIT_REPOSITORIES"
            find /root /opt /srv /var/www -maxdepth 4 -type d -name .git -printf '%h\n' 2>/dev/null | head -n 100 || true
            echo "SERVICE_NAMES"
            systemctl list-units --type=service --all --no-legend | awk '{print $1}' | grep -Ei 'wtyj|unboks|agent|worker|api' | head -n 100 || true
            echo "CONTAINER_NAMES"
            command -v docker >/dev/null 2>&1 && docker ps --format '{{.Names}} {{.Image}}' | head -n 100 || true

name: Audit Despertares double greeting

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-despertares-double-greeting.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect Despertares compose contract
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            echo "DOCKERFILE"
            sed -n '1,240p' /root/wtyj-agent-source/Dockerfile
            echo "COMPOSE"
            sed -n '1,240p' /root/clients/consulta-despertares/docker-compose.yml
            echo "HEALTH"
            docker inspect wtyj-consulta-despertares --format '{{json .Config.Healthcheck}}'
            docker inspect wtyj-consulta-despertares --format '{{json .State.Health}}'

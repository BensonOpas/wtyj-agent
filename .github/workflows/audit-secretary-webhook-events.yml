name: Audit secretary webhook events

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-secretary-webhook-events.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Audit outgoing WhatsApp webhook processing without message content
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            docker logs --since 72h wtyj-consulta-despertares 2>&1 | python3 -c '
            import json, sys
            lines = sys.stdin.readlines()
            tokens = (
              "webhook_received",
              "zernio_whatsapp_app_reply_synced",
              "zernio_sent_event_ignored",
              "zernio_sent_event_account_not_allowlisted",
              "zernio_sent_event_empty",
              "zernio_sent_event_duplicate",
            )
            print("SECRETARY_WEBHOOK_AUDIT=" + json.dumps({
              token: sum(token in line for line in lines)
              for token in tokens
            }, ensure_ascii=False))
            '

name: Deploy Despertares language lock

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-calvin-card-status.yml'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build, simulate, deploy, and verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 25m
          script: |
            set -eu
            SOURCE_REPO=/root/wtyj-agent-source
            TENANT_DIR=/root/clients/consulta-despertares
            DEPLOY_SHA=c8973cfc3a723b04bd7cb10464b4674892cc972f
            SHORT_SHA=$(printf '%s' "$DEPLOY_SHA" | cut -c1-7)
            NEW_IMAGE="wtyj-agent:despertares-engagement-$SHORT_SHA"
            BUILD_DIR=$(mktemp -d /tmp/despertares-language-build.XXXXXX)
            BACKUP_FILE="$TENANT_DIR/docker-compose.yml.pre-language-$SHORT_SHA"
            WORKTREE_ADDED=0
            SWITCHED=0
            DEPLOY_OK=0

            cleanup() {
              if test "$SWITCHED" = 1 && test "$DEPLOY_OK" != 1; then
                cp "$BACKUP_FILE" "$TENANT_DIR/docker-compose.yml"
                docker compose -f "$TENANT_DIR/docker-compose.yml" up -d --no-deps --force-recreate agent || true
              fi
              if test "$WORKTREE_ADDED" = 1; then
                git -C "$SOURCE_REPO" worktree remove --force "$BUILD_DIR" >/dev/null 2>&1 || true
              else
                rmdir "$BUILD_DIR" >/dev/null 2>&1 || true
              fi
            }
            trap cleanup EXIT

            git -C "$SOURCE_REPO" fetch origin main
            git -C "$SOURCE_REPO" cat-file -e "$DEPLOY_SHA^{commit}"
            git -C "$SOURCE_REPO" worktree add --detach "$BUILD_DIR" "$DEPLOY_SHA"
            WORKTREE_ADDED=1
            docker build -t "$NEW_IMAGE" "$BUILD_DIR"

            docker run --rm --entrypoint python \
              -v "$TENANT_DIR/config:/app/config:ro" \
              "$NEW_IMAGE" - <<'PY'
            from shared import tenant_hard_rules as rules

            exact = (
                "after winning the worldcup winning i feel that i am "
                "industructable and wanna fight a gorrilla .. is sthat healthy"
            )
            assert rules.detect_english_or_spanish(exact) == "English"
            assert rules.consulta_despertares_reply_language("hi", []) == "English"
            lock = rules.consulta_despertares_language_lock(
                exact,
                [{"role": "assistant", "text": "Hola, ¿cómo te puedo ayudar?"}],
            )
            assert "ENTIRE visible reply in English" in lock
            guarded = rules.enforce_consulta_despertares_boundaries(
                reply=(
                    "That feeling can be worth exploring with a professional. "
                    "Is there anything else I can help you with?"
                ),
                inbound_text=exact,
                history=[
                    {"role": "user", "text": "hi"},
                    {"role": "assistant", "text": "How can I help you today?"},
                ],
                fields={},
                intents=["inquiry"],
            )
            assert guarded.endswith(
                rules.CONSULTA_DESPERTARES_ENGLISH_PROSPECT_QUESTION
            )
            assert "anything else I can help you with" not in guarded
            print("PREDEPLOY_LANGUAGE_STATIC=passed")
            PY

            docker run --rm -i \
              --env-file "$TENANT_DIR/config/platform.env" \
              -v "$TENANT_DIR/config:/app/config:ro" \
              -v "$TENANT_DIR/data:/app/data:ro" \
              --entrypoint python "$NEW_IMAGE" - <<'PY'
            from agents.marina import marina_agent
            from shared import tenant_hard_rules as rules

            exact = (
                "after winning the worldcup winning i feel that i am "
                "industructable and wanna fight a gorrilla .. is sthat healthy"
            )
            spanish_history = [
                {"role": "user", "text": "hi"},
                {
                    "role": "assistant",
                    "text": (
                        "Hola, soy Alia, la asistente virtual de Consulta "
                        "Despertares. ¿Cómo te puedo ayudar?"
                    ),
                },
            ]
            mixed = marina_agent.process_message(
                from_email="despertares-language-simulation",
                subject="",
                body=exact,
                thread_fields={},
                thread_flags={},
                channel="whatsapp",
                messages=spanish_history,
            )
            mixed_reply = rules.enforce_consulta_despertares_boundaries(
                reply=str(mixed.get("reply") or ""),
                inbound_text=exact,
                history=spanish_history,
                fields=mixed.get("fields") or {},
                intents=mixed.get("intents") or [],
            )
            print("MIXED_LANGUAGE_REPLY=" + mixed_reply.replace("\n", " "))
            print(
                "MIXED_LANGUAGE_DETECTED="
                + rules.detect_english_or_spanish(mixed_reply)
            )
            assert rules.detect_english_or_spanish(mixed_reply) == "English"
            mixed_lower = mixed_reply.lower()
            assert "anything else i can help you with" not in mixed_lower
            assert "how can i help you today" not in mixed_lower
            assert "how we can help" not in mixed_lower
            assert "set that up" not in mixed_lower
            assert "tell me a little more" in mixed_lower
            assert mixed_reply.rstrip().endswith("?")

            first = marina_agent.process_message(
                from_email="despertares-first-hi-simulation",
                subject="",
                body="hi",
                thread_fields={},
                thread_flags={},
                channel="whatsapp",
                messages=[],
            )
            first_reply = rules.enforce_consulta_despertares_boundaries(
                reply=str(first.get("reply") or ""),
                inbound_text="hi",
                history=[],
                fields={},
                intents=first.get("intents") or [],
            )
            print("FIRST_HI_REPLY=" + first_reply.replace("\n", " "))
            print(
                "FIRST_HI_DETECTED="
                + rules.detect_english_or_spanish(first_reply)
            )
            assert first_reply.startswith(
                rules.CONSULTA_DESPERTARES_ENGLISH_GREETING
            )
            assert first_reply.lower().count("virtual assistant") == 1
            assert rules.detect_english_or_spanish(first_reply) == "English"
            print("MODEL_LANGUAGE_SIMULATIONS=passed")
            PY

            cp "$TENANT_DIR/docker-compose.yml" "$BACKUP_FILE"
            sed -i "s|^    image: .*|    image: $NEW_IMAGE|" "$TENANT_DIR/docker-compose.yml"
            docker compose -f "$TENANT_DIR/docker-compose.yml" config -q
            SWITCHED=1
            docker compose -f "$TENANT_DIR/docker-compose.yml" up -d --no-deps --force-recreate agent

            READY=0
            for attempt in $(seq 1 30); do
              RUNNING=$(docker inspect wtyj-consulta-despertares --format '{{.State.Running}}' 2>/dev/null || true)
              HTTP_CODE=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8103/health || true)
              if test "$RUNNING" = "true" && test "$HTTP_CODE" != "000"; then
                READY=1
                break
              fi
              sleep 2
            done
            echo "DEPLOY_READY=$READY"
            ACTUAL_IMAGE=$(docker inspect wtyj-consulta-despertares --format '{{.Config.Image}}' 2>/dev/null || true)
            echo "DEPLOY_ACTUAL_IMAGE=$ACTUAL_IMAGE"
            echo "DEPLOY_EXPECTED_IMAGE=$NEW_IMAGE"
            test "$READY" = 1
            test "$ACTUAL_IMAGE" = "$NEW_IMAGE"

            docker exec -i wtyj-consulta-despertares python - <<'PY'
            from shared import tenant_hard_rules as rules

            exact = (
                "after winning the worldcup winning i feel that i am "
                "industructable and wanna fight a gorrilla .. is sthat healthy"
            )
            assert rules.detect_english_or_spanish(exact) == "English"
            assert rules.consulta_despertares_reply_language("hi", []) == "English"
            assert "ENTIRE visible reply in English" in (
                rules.consulta_despertares_language_lock(exact, [])
            )
            guarded = rules.enforce_consulta_despertares_boundaries(
                reply="Is there anything else I can help you with?",
                inbound_text=exact,
                history=[
                    {"role": "user", "text": "hi"},
                    {"role": "assistant", "text": "How can I help you today?"},
                ],
                fields={},
                intents=["inquiry"],
            )
            assert guarded == rules.CONSULTA_DESPERTARES_ENGLISH_PROSPECT_QUESTION
            print("LIVE_PROSPECT_QUESTION=passed")
            print("LIVE_LANGUAGE_LOCK=passed")
            PY

            DEPLOY_OK=1
            echo "DEPLOYED_IMAGE=$NEW_IMAGE"
            echo "DEPLOYED_SHA=$DEPLOY_SHA"

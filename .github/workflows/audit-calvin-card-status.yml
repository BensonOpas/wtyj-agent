name: Audit Despertares language selection

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-calvin-card-status.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect live mixed-language conversation
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            CONTAINER=wtyj-consulta-despertares
            docker exec -i "$CONTAINER" python - <<'PY'
            import json
            import sqlite3

            config = json.load(open("/app/config/client.json", encoding="utf-8"))
            business = config.get("business") or {}
            print("LANG_CONFIG=" + json.dumps({
                "languages": business.get("languages"),
                "default_language": business.get("default_language"),
                "agent_name": business.get("agent_name"),
            }, ensure_ascii=False, sort_keys=True))

            db = sqlite3.connect("file:/app/data/state_registry.db?mode=ro", uri=True)
            db.row_factory = sqlite3.Row
            rows = db.execute(
                """
                SELECT id, phone, role, text, created_at, sender_name
                FROM whatsapp_threads
                WHERE lower(text) LIKE '%worldcup%'
                   OR lower(text) LIKE '%indestructible%'
                   OR lower(text) LIKE '%gorilla%'
                   OR lower(text) LIKE '%why do you write in spanish%'
                   OR lower(text) LIKE '%stick to english%'
                ORDER BY id
                """
            ).fetchall()
            print("LANG_THREAD=" + json.dumps([dict(row) for row in rows], ensure_ascii=False))
            phones = sorted({row["phone"] for row in rows})
            histories = {}
            for phone in phones:
                histories[phone] = [
                    dict(row) for row in db.execute(
                        "SELECT id, role, text, created_at, sender_name FROM whatsapp_threads WHERE phone = ? ORDER BY id",
                        (phone,),
                    ).fetchall()
                ]
            print("LANG_HISTORIES=" + json.dumps(histories, ensure_ascii=False, sort_keys=True))
            print("LANG_PHONE_COUNT=" + str(len(phones)))
            db.close()
            PY

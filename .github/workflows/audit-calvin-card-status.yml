name: Inspect Despertares active data mount

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-calvin-card-status.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Locate the running tenant database
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            CONTAINER=wtyj-consulta-despertares
            docker inspect "$CONTAINER" --format 'ACTIVE_MOUNTS={{json .Mounts}}'
            docker exec -i "$CONTAINER" python - <<'PY'
            import json
            import os
            import sqlite3

            found = []
            for root in ("/app/data", "/data", "/app"):
                if not os.path.isdir(root):
                    continue
                for walk_root, dirs, files in os.walk(root):
                    dirs[:] = [
                        d for d in dirs
                        if d not in {"__pycache__", ".git", "static", "templates"}
                    ]
                    for filename in files:
                        if not filename.endswith((".db", ".sqlite", ".sqlite3")):
                            continue
                        path = os.path.join(walk_root, filename)
                        tables = []
                        try:
                            db = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
                            tables = [
                                row[0] for row in db.execute(
                                    "SELECT name FROM sqlite_master WHERE type='table' ORDER BY name"
                                )
                            ]
                            db.close()
                        except sqlite3.DatabaseError:
                            pass
                        found.append({
                            "path": path,
                            "size": os.path.getsize(path),
                            "tables": tables,
                        })
            print("ACTIVE_DATABASES=" + json.dumps(found, sort_keys=True))
            PY

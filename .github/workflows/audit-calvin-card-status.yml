name: Audit Calvin tenant relationships

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-calvin-card-status.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve linked Calvin records without changes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            CONTAINER=wtyj-consulta-despertares
            docker exec -i "$CONTAINER" python - <<'PY'
            import json
            import sqlite3

            path = "/app/data/state_registry.db"
            db = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
            db.row_factory = sqlite3.Row
            needles = ("calvin", "adamus", "537473246", "6a623edb10e2ccd35f2c66a9")
            tables = [
                row[0] for row in db.execute(
                    "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
                )
            ]

            def rows_for(table):
                q = '"' + table.replace('"', '""') + '"'
                return db.execute(f"SELECT rowid AS __rowid__, * FROM {q}").fetchall()

            direct = {}
            target_customers = set()
            target_conversations = {"6a623edb10e2ccd35f2c66a9"}
            target_appointments = set()
            target_followups = set()
            target_notifications = set()
            for table in tables:
                matches = []
                for row in rows_for(table):
                    cols = [k for k in row.keys() if k != "__rowid__" and row[k] is not None and any(n in str(row[k]).lower() for n in needles)]
                    if cols:
                        matches.append(row)
                        if "customer_id" in row.keys() and row["customer_id"] is not None:
                            target_customers.add(row["customer_id"])
                        if table == "customers" and "id" in row.keys():
                            target_customers.add(row["id"])
                        if "conversation_id" in row.keys() and row["conversation_id"]:
                            target_conversations.add(str(row["conversation_id"]))
                        if table == "appointments" and "id" in row.keys():
                            target_appointments.add(row["id"])
                        if table == "follow_up_requests" and "id" in row.keys():
                            target_followups.add(row["id"])
                        if table == "pending_notifications" and "id" in row.keys():
                            target_notifications.add(row["id"])
                if matches:
                    direct[table] = matches

            # Identity rows can reveal their owning customer.
            for table in ("customer_identifiers", "customer_interactions"):
                if table in direct:
                    for row in direct[table]:
                        if "customer_id" in row.keys() and row["customer_id"] is not None:
                            target_customers.add(row["customer_id"])

            linked = []
            schemas = {}
            for table in tables:
                q = '"' + table.replace('"', '""') + '"'
                columns = [row[1] for row in db.execute(f"PRAGMA table_info({q})")]
                fks = [dict(row) for row in db.execute(f"PRAGMA foreign_key_list({q})")]
                selected = []
                for row in rows_for(table):
                    reasons = []
                    if "customer_id" in row.keys() and row["customer_id"] in target_customers:
                        reasons.append("customer_id")
                    if "conversation_id" in row.keys() and str(row["conversation_id"]) in target_conversations:
                        reasons.append("conversation_id")
                    if "phone" in row.keys() and str(row["phone"]) in target_conversations:
                        reasons.append("phone_conversation")
                    if "appointment_id" in row.keys() and row["appointment_id"] in target_appointments:
                        reasons.append("appointment_id")
                    if "follow_up_id" in row.keys() and row["follow_up_id"] in target_followups:
                        reasons.append("follow_up_id")
                    if "notification_id" in row.keys() and row["notification_id"] in target_notifications:
                        reasons.append("notification_id")
                    direct_cols = [k for k in row.keys() if k != "__rowid__" and row[k] is not None and any(n in str(row[k]).lower() for n in needles)]
                    if direct_cols:
                        reasons.append("direct:" + ",".join(direct_cols))
                    if reasons:
                        keys = {}
                        for key in ("id", "customer_id", "conversation_id", "phone", "phone_raw", "sender_id", "appointment_id", "follow_up_id", "notification_id", "customer_name", "display_name", "identifier_type", "value", "status"):
                            if key in row.keys():
                                keys[key] = row[key]
                        selected.append({"rowid": row["__rowid__"], "reasons": reasons, "keys": keys})
                if selected:
                    schemas[table] = {"columns": columns, "foreign_keys": fks}
                    linked.append({"table": table, "rows": selected})
            print("TARGET_CUSTOMER_IDS=" + json.dumps(sorted(target_customers, key=str)))
            print("TARGET_CONVERSATION_IDS=" + json.dumps(sorted(target_conversations, key=str)))
            print("TARGET_APPOINTMENT_IDS=" + json.dumps(sorted(target_appointments, key=str)))
            print("TARGET_FOLLOWUP_IDS=" + json.dumps(sorted(target_followups, key=str)))
            print("TARGET_NOTIFICATION_IDS=" + json.dumps(sorted(target_notifications, key=str)))
            print("CALVIN_SCHEMAS=" + json.dumps(schemas, ensure_ascii=False, sort_keys=True))
            print("CALVIN_LINKED=" + json.dumps(linked, ensure_ascii=False, sort_keys=True))
            print("CALVIN_LINKED_COUNT=" + str(sum(len(x["rows"]) for x in linked)))
            db.close()
            PY

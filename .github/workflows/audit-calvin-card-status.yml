name: Audit live Despertares prospect sessions

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-calvin-card-status.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Read the three most recent prospect conversations
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            CONTAINER=wtyj-consulta-despertares
            docker exec -i "$CONTAINER" python - <<'PY'
            import json
            import re
            import sqlite3

            db = sqlite3.connect("file:/app/data/state_registry.db?mode=ro", uri=True)
            db.row_factory = sqlite3.Row

            recent = [
                dict(row) for row in db.execute(
                    """
                    SELECT phone, min(created_at) AS first_at, max(created_at) AS last_at,
                           count(*) AS message_count,
                           max(CASE WHEN role = 'user' THEN sender_name ELSE '' END) AS sender_name
                    FROM whatsapp_threads
                    GROUP BY phone
                    ORDER BY last_at DESC
                    LIMIT 3
                    """
                ).fetchall()
            ]

            report = []
            for item in recent:
                messages = [
                    dict(row) for row in db.execute(
                        """
                        SELECT id, phone, role, text, created_at, sender_name
                        FROM whatsapp_threads
                        WHERE phone = ?
                        ORDER BY created_at, id
                        """,
                        (item["phone"],),
                    ).fetchall()
                ]
                assistants = [m for m in messages if m.get("role") == "assistant"]
                intros = [
                    m for m in assistants
                    if re.search(
                        r"\b(?:alia|alía)\b.*\b(?:virtual assistant|asistente virtual)\b",
                        str(m.get("text") or ""),
                        re.I | re.S,
                    )
                ]
                report.append({
                    **item,
                    "alia_intro_count": len(intros),
                    "alia_intro_positions": [
                        index + 1 for index, message in enumerate(messages)
                        if message in intros
                    ],
                    "first_user_message": next(
                        (m["text"] for m in messages if m["role"] == "user"), None
                    ),
                    "first_assistant_message": next(
                        (m["text"] for m in messages if m["role"] == "assistant"), None
                    ),
                    "messages": [
                        {
                            "at": m["created_at"],
                            "role": m["role"],
                            "text": m["text"],
                            "sender_name": m["sender_name"],
                        }
                        for m in messages
                    ],
                })

            print("LIVE_RECENT_THREE=" + json.dumps(report, ensure_ascii=False))
            db.close()
            PY

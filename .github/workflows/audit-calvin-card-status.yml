name: Reset Calvin in Despertares

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-calvin-card-status.yml'

permissions:
  contents: read

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Backup, delete exact Calvin records, and verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            TENANT_DIR=/root/clients/consulta-despertares
            CONTAINER=wtyj-consulta-despertares
            STAMP=$(date -u +%Y%m%dT%H%M%SZ)
            BACKUP_NAME="calvin-adamus-pre-reset-$STAMP.db"
            ARCHIVE_DIR="$TENANT_DIR/reset_archives"
            install -d -m 700 "$ARCHIVE_DIR"

            docker exec -i -e BACKUP_NAME="$BACKUP_NAME" "$CONTAINER" python - <<'PY'
            import json
            import os
            import sqlite3

            db_path = "/app/data/state_registry.db"
            backup_path = "/app/data/" + os.environ["BACKUP_NAME"]
            db = sqlite3.connect(db_path)
            db.row_factory = sqlite3.Row
            backup = sqlite3.connect(backup_path)
            db.backup(backup)
            backup.close()

            customer_ids = (1, 43)
            conversations = ("6a1481a1bc59f63d2ef733e3", "6a623edb10e2ccd35f2c66a9")
            deleted = {}
            statements = [
                ("whatsapp_threads", "DELETE FROM whatsapp_threads WHERE phone IN (?, ?)", conversations),
                ("whatsapp_booking_state", "DELETE FROM whatsapp_booking_state WHERE phone IN (?, ?)", conversations),
                ("inbound_processing_events", "DELETE FROM inbound_processing_events WHERE conversation_id IN (?, ?)", conversations),
                ("follow_up_requests", "DELETE FROM follow_up_requests WHERE id = 34 OR conversation_id IN (?, ?) OR phone_normalized = ?", (conversations[0], conversations[1], "537473246")),
                ("conversation_status", "DELETE FROM conversation_status WHERE conversation_id IN (?, ?)", conversations),
                ("appointments", "DELETE FROM appointments WHERE id = 1 OR conversation_id IN (?, ?) OR lower(trim(customer_name)) IN ('calvin', 'calvin adamus')", conversations),
                ("pending_notifications", "DELETE FROM pending_notifications WHERE id = 11 OR customer_id IN (?, ?) OR lower(trim(customer_name)) IN ('calvin', 'calvin adamus')", conversations),
                ("customer_interactions", "DELETE FROM customer_interactions WHERE customer_id IN (?, ?)", customer_ids),
                ("customer_identifiers", "DELETE FROM customer_identifiers WHERE customer_id IN (?, ?) OR value IN (?, ?, ?)", (customer_ids[0], customer_ids[1], conversations[0], conversations[1], "537473246")),
                ("customers", "DELETE FROM customers WHERE id IN (?, ?) OR lower(trim(display_name)) IN ('calvin', 'calvin adamus')", customer_ids),
            ]
            try:
                db.execute("BEGIN IMMEDIATE")
                for table, sql, params in statements:
                    cur = db.execute(sql, params)
                    deleted[table] = cur.rowcount
                db.commit()
            except Exception:
                db.rollback()
                raise

            needles = ("calvin", "adamus", "537473246", "6a1481a1bc59f63d2ef733e3", "6a623edb10e2ccd35f2c66a9")
            residual = []
            tables = [
                row[0] for row in db.execute(
                    "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
                )
            ]
            for table in tables:
                quoted = '"' + table.replace('"', '""') + '"'
                columns = [row[1] for row in db.execute(f"PRAGMA table_info({quoted})")]
                for row in db.execute(f"SELECT rowid AS __rowid__, * FROM {quoted}"):
                    matched = [
                        column for column in columns
                        if row[column] is not None and any(n in str(row[column]).lower() for n in needles)
                    ]
                    if matched:
                        residual.append({"table": table, "rowid": row["__rowid__"], "columns": matched})
            print("CALVIN_DELETED=" + json.dumps(deleted, sort_keys=True))
            print("CALVIN_LIVE_RESIDUAL=" + json.dumps(residual, sort_keys=True))
            print("CALVIN_LIVE_RESIDUAL_COUNT=" + str(len(residual)))
            assert not residual
            db.close()
            PY

            test -f "$TENANT_DIR/data/$BACKUP_NAME"
            mv -- "$TENANT_DIR/data/$BACKUP_NAME" "$ARCHIVE_DIR/$BACKUP_NAME"
            chmod 600 "$ARCHIVE_DIR/$BACKUP_NAME"

            if test -f "$TENANT_DIR/data/calvin-card-repair-6fb2701.db"; then
              mv -- "$TENANT_DIR/data/calvin-card-repair-6fb2701.db" "$ARCHIVE_DIR/calvin-card-repair-6fb2701.db"
            fi
            if test -f "$TENANT_DIR/data/reset_backups/calvin-adamus-reset-20260728T224812Z.db"; then
              mv -- "$TENANT_DIR/data/reset_backups/calvin-adamus-reset-20260728T224812Z.db" "$ARCHIVE_DIR/calvin-adamus-reset-20260728T224812Z.db"
            fi

            docker compose -f "$TENANT_DIR/docker-compose.yml" up -d --no-deps --force-recreate agent
            READY=0
            for attempt in $(seq 1 30); do
              RUNNING=$(docker inspect "$CONTAINER" --format '{{.State.Running}}' 2>/dev/null || true)
              HTTP_CODE=$(curl --max-time 2 -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8103/health || true)
              if test "$RUNNING" = "true" && test "$HTTP_CODE" != "000"; then
                READY=1
                break
              fi
              sleep 2
            done
            test "$READY" = 1

            docker exec -i "$CONTAINER" python - <<'PY'
            import json
            import os
            import sqlite3

            data_dir = "/app/data"
            needles = ("calvin", "adamus", "537473246", "6a1481a1bc59f63d2ef733e3", "6a623edb10e2ccd35f2c66a9")
            matches = []
            for root, _, files in os.walk(data_dir):
                for filename in sorted(files):
                    path = os.path.join(root, filename)
                    if not filename.endswith((".db", ".sqlite", ".sqlite3")):
                        continue
                    try:
                        db = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
                        db.row_factory = sqlite3.Row
                        tables = [
                            row[0] for row in db.execute(
                                "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
                            )
                        ]
                        for table in tables:
                            quoted = '"' + table.replace('"', '""') + '"'
                            columns = [row[1] for row in db.execute(f"PRAGMA table_info({quoted})")]
                            for row in db.execute(f"SELECT rowid AS __rowid__, * FROM {quoted}"):
                                cols = [
                                    column for column in columns
                                    if row[column] is not None and any(n in str(row[column]).lower() for n in needles)
                                ]
                                if cols:
                                    matches.append({
                                        "db": os.path.relpath(path, data_dir),
                                        "table": table,
                                        "rowid": row["__rowid__"],
                                        "columns": cols,
                                    })
                        db.close()
                    except sqlite3.DatabaseError:
                        pass
            print("CALVIN_POST_RESTART_MATCHES=" + json.dumps(matches, sort_keys=True))
            print("CALVIN_POST_RESTART_COUNT=" + str(len(matches)))
            assert not matches
            PY

            echo "CALVIN_RESET=complete"
            echo "CALVIN_BACKUP=$ARCHIVE_DIR/$BACKUP_NAME"

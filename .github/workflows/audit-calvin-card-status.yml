name: Audit Calvin tenant records

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/audit-calvin-card-status.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve Calvin records without changes
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 10m
          script: |
            set -eu
            TENANT_DIR=/root/clients/consulta-despertares
            CONTAINER=wtyj-consulta-despertares
            docker exec -i "$CONTAINER" python - <<'PY'
            import json
            import os
            import sqlite3

            data_dir = "/app/data"
            needles = ("calvin", "adamus", "537473246", "6a623edb10e2ccd35f2c66a9")
            report = []
            for root, _, files in os.walk(data_dir):
                for filename in sorted(files):
                    path = os.path.join(root, filename)
                    rel = os.path.relpath(path, data_dir)
                    if filename.endswith((".db", ".sqlite", ".sqlite3")):
                        try:
                            db = sqlite3.connect(f"file:{path}?mode=ro", uri=True)
                            db.row_factory = sqlite3.Row
                            tables = [
                                row[0] for row in db.execute(
                                    "SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%'"
                                )
                            ]
                            for table in tables:
                                quoted = '"' + table.replace('"', '""') + '"'
                                columns = [row[1] for row in db.execute(f"PRAGMA table_info({quoted})")]
                                if not columns:
                                    continue
                                rows = db.execute(f"SELECT rowid AS __rowid__, * FROM {quoted}").fetchall()
                                for row in rows:
                                    matched_columns = []
                                    for column in columns:
                                        value = row[column]
                                        if value is not None and any(n in str(value).lower() for n in needles):
                                            matched_columns.append(column)
                                    if matched_columns:
                                        keys = {}
                                        for key in ("id", "conversation_id", "sender_id", "from_email", "phone", "phone_raw", "customer_name", "first_name", "surnames", "status"):
                                            if key in row.keys():
                                                keys[key] = row[key]
                                        report.append({
                                            "db": rel,
                                            "table": table,
                                            "rowid": row["__rowid__"],
                                            "matched_columns": matched_columns,
                                            "keys": keys,
                                        })
                            db.close()
                        except sqlite3.DatabaseError:
                            pass
                    elif os.path.getsize(path) <= 5_000_000:
                        try:
                            text = open(path, "r", encoding="utf-8", errors="ignore").read().lower()
                        except OSError:
                            continue
                        if any(n in text for n in needles):
                            report.append({"file": rel, "type": "text_match"})
            print("CALVIN_AUDIT=" + json.dumps(report, ensure_ascii=False, sort_keys=True))
            print("CALVIN_AUDIT_COUNT=" + str(len(report)))
            PY
